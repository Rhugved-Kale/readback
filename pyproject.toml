[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readback"
version = "0.1.0"
description = "An ops agent that re-reads live state before reporting success."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "live" is deselected by default: those tests spend real money, write to a real
# Notion workspace and post to a real Slack channel. Run them deliberately with
#   pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: hits real Stripe/Notion/Slack APIs. Requires .env. Not run by default.",
]
